name: MCP acceptance

on:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

jobs:
  stdio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
      - name: Test stdio tools and store coordination
        run: make mcp-test
